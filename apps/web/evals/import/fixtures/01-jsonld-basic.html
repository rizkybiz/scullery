<!doctype html>
<html>
  <head>
    <title>Weeknight Garlic Butter Pasta | Small Pan Kitchen</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Weeknight Garlic Butter Pasta",
        "description": "A ten-minute pantry pasta.",
        "recipeYield": "2 servings",
        "prepTime": "PT5M",
        "cookTime": "PT12M",
        "recipeIngredient": [
          "200 g spaghetti",
          "3 cloves garlic, minced",
          "30 g butter",
          "1 tbsp olive oil",
          "Salt to taste"
        ],
        "recipeInstructions": [
          { "@type": "HowToStep", "text": "Boil the spaghetti in salted water until al dente." },
          {
            "@type": "HowToStep",
            "text": "Melt the butter with the oil and cook the garlic for 1 minute."
          },
          { "@type": "HowToStep", "text": "Toss the pasta in the pan and season." }
        ]
      }
    </script>
  </head>
  <body>
    <h1>Weeknight Garlic Butter Pasta</h1>
    <p>My kids ask for this every week...</p>
  </body>
</html>
