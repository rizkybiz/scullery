<!doctype html>
<html>
  <head>
    <title>Chicken Pot Pie</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Chicken Pot Pie",
        "recipeYield": "6",
        "recipeIngredient": [
          "For the filling:",
          "2 tbsp butter",
          "1 onion, diced",
          "2 cups cooked chicken, shredded",
          "1 cup frozen peas",
          "For the crust:",
          "1 sheet puff pastry",
          "1 egg, beaten"
        ],
        "recipeInstructions": [
          {
            "@type": "HowToSection",
            "name": "Make the filling",
            "itemListElement": [
              {
                "@type": "HowToStep",
                "text": "Melt the butter and soften the onion for 5 minutes."
              },
              {
                "@type": "HowToStep",
                "text": "Stir in the chicken and peas and spoon into a dish."
              }
            ]
          },
          {
            "@type": "HowToSection",
            "name": "Top and bake",
            "itemListElement": [
              { "@type": "HowToStep", "text": "Cover with the pastry and brush with egg." },
              { "@type": "HowToStep", "text": "Bake for 30 minutes until golden." }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <h1>Chicken Pot Pie</h1>
  </body>
</html>
