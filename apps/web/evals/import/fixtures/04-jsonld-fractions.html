<!doctype html>
<html>
  <head>
    <title>Buttermilk Pancakes</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Buttermilk Pancakes",
        "recipeYield": "4",
        "recipeIngredient": [
          "1 ½ cups all-purpose flour",
          "¾ tsp salt",
          "1/2 cup milk",
          "1 1/4 cups buttermilk",
          "2 tablespoons sugar",
          "1 egg"
        ],
        "recipeInstructions": "Whisk the dry ingredients. Whisk the wet ingredients and stir them into the dry. Cook on a hot griddle until bubbles form, then flip."
      }
    </script>
  </head>
  <body>
    <h1>Buttermilk Pancakes</h1>
  </body>
</html>
