<!doctype html>
<html>
  <head>
    <title>Garlicky Greens</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Garlicky Greens",
        "recipeYield": "2-3 servings",
        "recipeIngredient": [
          "2-3 cloves garlic, sliced",
          "1 to 2 tbsp olive oil",
          "1 bunch kale",
          "1/4 tsp chili flakes"
        ],
        "recipeInstructions": [
          "Warm the oil and garlic over low heat.",
          "Add the kale and cook for 4-5 minutes until wilted.",
          "Season with the chili flakes."
        ]
      }
    </script>
  </head>
  <body>
    <h1>Garlicky Greens</h1>
  </body>
</html>
