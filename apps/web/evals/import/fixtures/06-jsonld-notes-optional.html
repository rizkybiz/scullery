<!doctype html>
<html>
  <head>
    <title>Tomato Bruschetta</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Tomato Bruschetta",
        "recipeYield": "4",
        "recipeIngredient": [
          "4 ripe tomatoes, diced",
          "1 clove garlic, halved",
          "8 slices baguette",
          "2 tbsp olive oil",
          "salt and pepper, to taste",
          "fresh basil, optional, for garnish"
        ],
        "recipeInstructions": [
          "Toast the bread and rub with the cut garlic.",
          "Toss the tomatoes with the oil and season.",
          "Spoon onto the toast and add basil if using."
        ]
      }
    </script>
  </head>
  <body>
    <h1>Tomato Bruschetta</h1>
  </body>
</html>
