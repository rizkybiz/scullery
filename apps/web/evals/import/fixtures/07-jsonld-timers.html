<!doctype html>
<html>
  <head>
    <title>Slow Beef Chili</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Slow Beef Chili",
        "recipeYield": "6",
        "prepTime": "PT20M",
        "cookTime": "PT2H",
        "recipeIngredient": [
          "1 kg beef chuck, cubed",
          "2 onions, chopped",
          "2 cans kidney beans",
          "2 tbsp chili powder"
        ],
        "recipeInstructions": [
          "Brown the beef in batches.",
          "Soften the onions for 8 minutes.",
          "Add everything else and simmer for 1 hour 30 minutes.",
          "Rest for 10 minutes before serving."
        ]
      }
    </script>
  </head>
  <body>
    <h1>Slow Beef Chili</h1>
