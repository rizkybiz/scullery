name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the older run; main runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: registry.example.com
  IMAGE_NAME: scullery/api

jobs:
  verify:
    name: verify
    runs-on: [self-hosted, docker-build]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit-message check needs history

      # Track the latest 1.26.x patch rather than the exact version in go.mod
      # (1.26.0): standard-library security fixes ship in patch releases, and
      # govulncheck reports an unpatched toolchain. check-latest stops setup-go
      # from reusing an older 1.26.x already cached on the runner.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
          cache: false # the runner keeps its own Go module and build caches

      - name: gofmt, tidy, vet, tests
        run: ./scripts/ci/verify.sh

      - name: Conventional Commits
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci/check-commits.sh "$BASE_SHA" "$HEAD_SHA"

      # Informational: a new advisory against the Go toolchain should be visible,
      # not block every unrelated PR.
      - name: govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    name: image
    needs: verify
    runs-on: [self-hosted, docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: meta
        run: |
          short="${GITHUB_SHA::7}"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${IMAGE_NAME}:sha-${short}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          REF: ${{ steps.meta.outputs.ref }}
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          docker build --pull \
            --build-arg VERSION="sha-${SHORT}" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -t "${REF}" .

      - name: Migration round-trip and smoke test
        env:
          REF: ${{ steps.meta.outputs.ref }}
        run: ./scripts/ci/image-checks.sh "${REF}"

      # Pull requests build and test only; nothing is published until it is on main.
      - name: Push to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ZOT_CI_PASSWORD: ${{ secrets.ZOT_CI_PASSWORD }}
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          # Keep credentials out of the runner user's ~/.docker for good.
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "${DOCKER_CONFIG}"' EXIT

          echo "${ZOT_CI_PASSWORD}" | docker login "${REGISTRY}" -u ci --password-stdin

          main_ref="${REGISTRY}/${IMAGE_NAME}:main"
          docker tag "${REF}" "${main_ref}"
          docker push "${REF}"
          docker push "${main_ref}"

          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${REF}")"
          {
            echo "### Published image"
            echo
            echo "- Pin this tag when deploying: \`${REF##*:}\`"
            echo "- Digest: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
