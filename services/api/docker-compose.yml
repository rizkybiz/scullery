# Local development stack: Postgres + one-off migration + API.
#   docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scullery
      POSTGRES_PASSWORD: scullery
      POSTGRES_DB: scullery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scullery -d scullery"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Admin process: applies migrations, then exits.
  migrate:
    build: .
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://scullery:scullery@db:5432/scullery?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      PORT: "8080"
      LOG_LEVEL: debug
      DATABASE_URL: postgres://scullery:scullery@db:5432/scullery?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
